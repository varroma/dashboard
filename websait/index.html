<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ВЕБСАЙТ.ПРО — вход</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f9fc;font:16px Arial,sans-serif;color:#111827}.card{width:min(92vw,370px);padding:32px;border:1px solid #e6e9ef;border-radius:18px;background:#fff;box-shadow:0 16px 50px #18304b14}h1{margin:0 0 8px;font-size:27px}p{color:#667085;line-height:1.4}input,button{width:100%;padding:13px;border-radius:10px;font:inherit}input{border:1px solid #cdd5df;letter-spacing:4px}button{margin-top:12px;background:#2d6cff;color:#fff;border:0;cursor:pointer;font-weight:700}.error{color:#b42318;min-height:22px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}</style></head><body><main class="card" id="gate"><h1>ВЕБСАЙТ.ПРО</h1><p>Введите ПИН для просмотра текущих проектов</p><form id="form"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" required aria-label="ПИН-код"><button>Открыть</button></form><p class="error" id="error" role="alert"></p></main><script>
const accessKey='websait-access-until-1day';
const accessPeriod=24*60*60*1000;
function openDashboard(){const frame=document.createElement('iframe');frame.title='ВЕБСАЙТ.ПРО — текущие проекты';frame.src='dashboard.html?v='+Date.now();document.body.replaceChildren(frame)}
let expires=0;try{expires=Number(localStorage.getItem(accessKey))||0}catch(e){}
if(expires>Date.now())openDashboard();else{try{localStorage.removeItem(accessKey)}catch(e){}document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();if(document.querySelector('#pin').value==='1504'){try{localStorage.setItem(accessKey,String(Date.now()+accessPeriod))}catch(e){}openDashboard()}else document.querySelector('#error').textContent='Неверный ПИН-код.'})}
</script></body></html>
