<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Айти45 — вход</title><meta name="theme-color" content="#ffffff"><meta name="application-name" content="Айти45"><meta name="apple-mobile-web-app-title" content="Айти45"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f5;font:16px Arial,sans-serif;color:#10201a}.card{width:min(92vw,370px);padding:32px;border-radius:18px;background:white;box-shadow:0 16px 50px #1a4b3320}h1{margin:0 0 8px;font-size:27px}p{color:#56675e;line-height:1.4}input,button{width:100%;padding:13px;border-radius:10px;font:inherit}input{border:1px solid #acbcb3;letter-spacing:4px}button{margin-top:12px;background:#00aa57;color:white;border:0;cursor:pointer}button:disabled{opacity:.6}.error{color:#b82e39;min-height:22px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}</style></head><body><main class="card" id="gate"><h1>Айти45</h1><p>Введите ПИН для просмотра дашборда</p><form id="form"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" required aria-label="ПИН-код"><button id="button">Открыть</button></form><p class="error" id="error" role="alert"></p></main><script>
const accessKey='aiti45-access-until';
const accessPeriod=30*24*60*60*1000;
function openDashboard(){
  const frame=document.createElement('iframe');
  frame.title='Айти45 Dashboard';
  frame.src='dashboard.html';
  document.body.replaceChildren(frame);
}
let expires=0;
try{expires=Number(localStorage.getItem(accessKey))||0}catch(e){}
if(expires>Date.now())openDashboard();
else{
  try{localStorage.removeItem(accessKey)}catch(e){}
  document.querySelector('#form').addEventListener('submit',e=>{
    e.preventDefault();
    if(document.querySelector('#pin').value==='2112'){
      try{localStorage.setItem(accessKey,String(Date.now()+accessPeriod))}catch(e){}
      openDashboard();
    }else document.querySelector('#error').textContent='Неверный ПИН-код.';
  });
}
</script></body></html>
